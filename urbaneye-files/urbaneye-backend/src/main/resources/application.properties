# Server config
server.port=8080
server.address=0.0.0.0

# Firebase configuration (To be supplied by user)
# Note: For hackathon development, you can place your firebase-service-account.json 
# in src/main/resources and reference it below if it's not stored via an env var.
firebase.credentials.path=classpath:firebase-service-account.json

# Cache configuration for Nominatim / Geocoding
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h

# Disable Spring Security default login form
spring.security.user.name=admin
spring.security.user.password=admin

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/urbaneye?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:\#Prasad@2007}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ── Featherless AI ──────────────────────────────────────────
featherless.apiKey=${FEATHERLESS_API_KEY:rc_c904b734f17acacf53880dd4002fcd8c120504478027f5a6273e395ec80c1056}
featherless.baseUrl=https://api.featherless.ai/v1
# Primary model (largest / best quality)
featherless.model=Qwen/Qwen3-VL-32B-Instruct
# Secondary model (tried when primary returns 503)
featherless.secondaryModel=Qwen/Qwen2.5-VL-72B-Instruct
# Tertiary model (tried when secondary also returns 503)
featherless.tertiaryModel=Qwen/Qwen3-VL-8B-Instruct